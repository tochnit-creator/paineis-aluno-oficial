<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Esboços Bíblicos — Entrar</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --gold:#c8960c;--gold2:#e8b800;--gold-light:#fdf5dc;
  --wine:#7B1535;--wine2:#9b1f45;
  --navy:#1A1F3C;--navy2:#242a4a;
  --text:#1A1F3C;--text2:#3d3550;--text3:#8a7a8a;
  --border:#d8c8d0;--border2:#c8b0bc;
  --bg:#fff;--bg2:#f8f4f0;--bg3:#f0e8e0;
}
body{font-family:'DM Sans',sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:1.5rem;position:relative;background:linear-gradient(135deg,#1A1F3C 0%,#3d1535 50%,#7B1535 100%);}


.card{position:relative;z-index:1;}
.card{background:var(--bg);border:1px solid var(--border);border-radius:14px;width:100%;max-width:400px;overflow:hidden;box-shadow:0 4px 32px rgba(0,0,0,0.06);}

.card-header{padding:2rem 2rem 1.5rem;text-align:center;border-bottom:1px solid var(--border);}
.logo{display:inline-flex;align-items:center;gap:10px;margin-bottom:1.25rem;}
.logo-icon{width:36px;height:36px;background:var(--text);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:18px;color:var(--gold2);font-family:'Playfair Display',serif;font-weight:600;}
.logo-text{font-family:'Playfair Display',serif;font-size:18px;color:#fff;}
.logo-text span{color:var(--gold2);}
.card-title{font-family:'Playfair Display',serif;font-size:22px;font-weight:400;color:var(--text);margin-bottom:4px;}
.card-sub{font-size:13px;color:var(--text3);font-weight:300;}

.card-body{padding:1.75rem 2rem;}

/* TABS LOGIN/CADASTRO */
.auth-tabs{display:flex;background:var(--bg2);border-radius:8px;padding:3px;border:1px solid var(--border);margin-bottom:1.5rem;gap:3px;}
.auth-tab{flex:1;padding:7px;font-size:13px;font-family:'DM Sans',sans-serif;background:none;border:none;color:var(--text3);cursor:pointer;border-radius:6px;transition:all .15s;}
.auth-tab.active{background:var(--wine);color:#fff;border:1px solid var(--wine);font-weight:500;}

/* FORM */
.form-group{margin-bottom:1rem;}
.form-label{display:block;font-size:12px;font-weight:500;color:var(--text2);margin-bottom:5px;letter-spacing:.02em;}
.form-input{width:100%;padding:10px 12px;border:1px solid var(--border2);border-radius:8px;font-size:14px;font-family:'DM Sans',sans-serif;color:var(--text);background:var(--bg);outline:none;transition:border-color .15s;}
.form-input:focus{border-color:var(--wine);}
.form-input::placeholder{color:var(--text3);}

.btn-primary{width:100%;padding:11px;background:var(--wine);color:#fff;border:none;border-radius:8px;font-size:14px;font-family:'DM Sans',sans-serif;font-weight:500;cursor:pointer;transition:opacity .15s;margin-top:.25rem;}
.btn-primary:hover{opacity:.85;}
.btn-primary:disabled{opacity:.5;cursor:not-allowed;}

.divider{display:flex;align-items:center;gap:10px;margin:1.25rem 0;color:var(--text3);font-size:12px;}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--border);}

.btn-google{width:100%;padding:10px;background:var(--bg);color:var(--text2);border:1px solid var(--border2);border-radius:8px;font-size:13px;font-family:'DM Sans',sans-serif;cursor:pointer;transition:all .15s;display:flex;align-items:center;justify-content:center;gap:8px;}
.btn-google:hover{background:var(--bg2);border-color:var(--border);}
.btn-google svg{width:16px;height:16px;}

/* MENSAGENS */
.msg{font-size:13px;padding:10px 12px;border-radius:7px;margin-top:1rem;display:none;}
.msg.error{background:#fef0f0;color:#c0392b;border:1px solid #f5c6c6;display:block;}
.msg.success{background:#f0fef4;color:#1a7a3a;border:1px solid #c6e8d1;display:block;}
.msg.info{background:#faf0f3;color:var(--wine);border:1px solid #e0b0bc;display:block;}

/* PLANOS */
.planos{margin-top:1.5rem;border-top:1px solid var(--border);padding-top:1.25rem;}
.planos-title{font-size:11px;color:var(--text3);letter-spacing:.08em;text-transform:uppercase;margin-bottom:.75rem;text-align:center;}
.planos-grid{display:flex;gap:6px;}
.plano-card{flex:1;padding:8px;border:1px solid var(--border);border-radius:8px;text-align:center;}
.plano-nome{font-size:11px;font-weight:500;color:var(--text2);margin-bottom:3px;}
.plano-acesso{font-size:10px;color:var(--text3);line-height:1.4;}
.plano-card.destaque{border-color:var(--wine);background:#faf0f3;}
.plano-card.destaque .plano-nome{color:var(--wine);}

/* FORGOT */
.forgot{font-size:12px;color:var(--text3);text-align:right;margin-top:.4rem;cursor:pointer;text-decoration:underline;}
.forgot:hover{color:var(--gold);}

/* LOADING */
.spinner{width:16px;height:16px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .6s linear infinite;display:inline-block;margin-right:6px;vertical-align:middle;}
@keyframes spin{to{transform:rotate(360deg);}}

.panel-form{display:none;}
.panel-form.active{display:block;}
</style>
</head>
<body>

<div class="card">
  <div class="card-header">
    <div class="logo">
      <div class="logo-icon">🤲</div>
      <div class="logo-text">Esboços <span>Bíblicos</span></div>
    </div>
    <div class="card-title">Bem-vindo</div>
    <div class="card-sub">Entre ou crie sua conta para acessar</div>
  </div>

  <div class="card-body">
    <div class="auth-tabs">
      <button class="auth-tab active" onclick="switchAuth('login')">Entrar</button>
      <button class="auth-tab" onclick="switchAuth('cadastro')">Criar conta</button>
    </div>

    <!-- LOGIN -->
    <div class="panel-form active" id="panel-login">
      <div class="form-group">
        <label class="form-label">E-mail</label>
        <input class="form-input" type="email" id="login-email" placeholder="seu@email.com"/>
      </div>
      <div class="form-group">
        <label class="form-label">Senha</label>
        <input class="form-input" type="password" id="login-senha" placeholder="••••••••" onkeydown="if(event.key==='Enter')fazerLogin()"/>
        <div class="forgot" onclick="esqueceuSenha()">Esqueci minha senha</div>
      </div>
      <button class="btn-primary" id="btn-login" onclick="fazerLogin()">Entrar</button>
    </div>

    <!-- CADASTRO -->
    <div class="panel-form" id="panel-cadastro">
      <div class="form-group">
        <label class="form-label">Nome completo</label>
        <input class="form-input" type="text" id="cad-nome" placeholder="Seu nome"/>
      </div>
      <div class="form-group">
        <label class="form-label">E-mail</label>
        <input class="form-input" type="email" id="cad-email" placeholder="seu@email.com"/>
      </div>
      <div class="form-group">
        <label class="form-label">Senha</label>
        <input class="form-input" type="password" id="cad-senha" placeholder="Mín. 6 caracteres" onkeydown="if(event.key==='Enter')fazerCadastro()"/>
      </div>
      <button class="btn-primary" id="btn-cadastro" onclick="fazerCadastro()">Criar conta</button>
    </div>

    <div id="msg-auth" class="msg"></div>

    <div class="divider">ou</div>
    <button class="btn-google" onclick="loginGoogle()">
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
      Continuar com Google
    </button>

    <!-- PLANOS INFO -->
    <div class="planos">
      <div class="planos-title">Planos de acesso</div>
      <div class="planos-grid">
        <div class="plano-card">
          <div class="plano-nome">Gratuito</div>
          <div class="plano-acesso">Pregação</div>
        </div>
        <div class="plano-card">
          <div class="plano-nome">Básico</div>
          <div class="plano-acesso">+ Ensino e EBD</div>
        </div>
        <div class="plano-card destaque">
          <div class="plano-nome">Premium</div>
          <div class="plano-acesso">Acesso completo</div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Firebase SDK -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, GoogleAuthProvider, signInWithPopup, signInWithRedirect, getRedirectResult, sendPasswordResetEmail, onAuthStateChanged, updateProfile } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
  import { getFirestore, doc, getDoc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  // ⚠️ SUBSTITUA PELAS SUAS CREDENCIAIS DO FIREBASE
  const firebaseConfig = {
    apiKey: "AIzaSyCUnfgLUuQfY6tTuUYUGkKceXTB1LDLf3M",
    authDomain: "esbocos-biblicos.firebaseapp.com",
    projectId: "esbocos-biblicos",
    storageBucket: "esbocos-biblicos.firebasestorage.app",
    messagingSenderId: "750572710955",
    appId: "1:750572710955:web:a6cce3e11d178862a38e6e"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  // Detecta mobile/iOS
  const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);

  // Redireciona se já logado + captura resultado do redirect Google
  onAuthStateChanged(auth, async (user) => {
    if (user) {
      await garantirUsuario(user);
      window.location.href = 'app.html';
    }
  });

  // Captura resultado do redirect (iOS/Android)
  try {
    const result = await getRedirectResult(auth);
    if (result?.user) {
      await garantirUsuario(result.user);
      window.location.href = 'app.html';
    }
  } catch (e) {
    console.log('redirect result:', e);
  }

  // Garante que usuário existe no Firestore com plano gratuito
  async function garantirUsuario(user, nome) {
    const ref = doc(db, 'usuarios', user.uid);
    const snap = await getDoc(ref);
    if (!snap.exists()) {
      await setDoc(ref, {
        nome: nome || user.displayName || user.email.split('@')[0],
        email: user.email,
        plano: 'gratuito',
        criadoEm: serverTimestamp()
      });
    }
  }

  function mostrarMsg(texto, tipo) {
    const el = document.getElementById('msg-auth');
    el.textContent = texto;
    el.className = 'msg ' + tipo;
  }

  function setLoading(btnId, loading) {
    const btn = document.getElementById(btnId);
    btn.disabled = loading;
    btn.innerHTML = loading ? '<span class="spinner"></span>Aguarde...' : (btnId === 'btn-login' ? 'Entrar' : 'Criar conta');
  }

  window.switchAuth = (tab) => {
    document.querySelectorAll('.auth-tab').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.panel-form').forEach(p => p.classList.remove('active'));
    event.target.classList.add('active');
    document.getElementById('panel-' + tab).classList.add('active');
    document.getElementById('msg-auth').className = 'msg';
  };

  window.fazerLogin = async () => {
    const email = document.getElementById('login-email').value.trim();
    const senha = document.getElementById('login-senha').value;
    if (!email || !senha) return mostrarMsg('Preencha e-mail e senha.', 'error');
    setLoading('btn-login', true);
    try {
      await signInWithEmailAndPassword(auth, email, senha);
    } catch (e) {
      const msgs = { 'auth/user-not-found': 'Usuário não encontrado.', 'auth/wrong-password': 'Senha incorreta.', 'auth/invalid-email': 'E-mail inválido.', 'auth/invalid-credential': 'E-mail ou senha incorretos.' };
      mostrarMsg(msgs[e.code] || 'Erro ao entrar. Tente novamente.', 'error');
      setLoading('btn-login', false);
    }
  };

  window.fazerCadastro = async () => {
    const nome = document.getElementById('cad-nome').value.trim();
    const email = document.getElementById('cad-email').value.trim();
    const senha = document.getElementById('cad-senha').value;
    if (!nome || !email || !senha) return mostrarMsg('Preencha todos os campos.', 'error');
    if (senha.length < 6) return mostrarMsg('A senha deve ter ao menos 6 caracteres.', 'error');
    setLoading('btn-cadastro', true);
    try {
      const cred = await createUserWithEmailAndPassword(auth, email, senha);
      await updateProfile(cred.user, { displayName: nome });
      await garantirUsuario(cred.user, nome);
    } catch (e) {
      const msgs = { 'auth/email-already-in-use': 'Este e-mail já está cadastrado.', 'auth/invalid-email': 'E-mail inválido.', 'auth/weak-password': 'Senha muito fraca.' };
      mostrarMsg(msgs[e.code] || 'Erro ao criar conta.', 'error');
      setLoading('btn-cadastro', false);
    }
  };

  window.loginGoogle = async () => {
    try {
      const provider = new GoogleAuthProvider();
      if (isMobile) {
        // iOS/Android: usa redirect (não bloqueia popup)
        await signInWithRedirect(auth, provider);
      } else {
        // Desktop: usa popup
        const cred = await signInWithPopup(auth, provider);
        await garantirUsuario(cred.user);
      }
    } catch (e) {
      mostrarMsg('Erro ao entrar com Google. Tente e-mail e senha.', 'error');
    }
  };

  window.esqueceuSenha = async () => {
    const email = document.getElementById('login-email').value.trim();
    if (!email) return mostrarMsg('Digite seu e-mail acima para recuperar a senha.', 'info');
    try {
      await sendPasswordResetEmail(auth, email);
      mostrarMsg('E-mail de recuperação enviado!', 'success');
    } catch (e) {
      mostrarMsg('E-mail não encontrado.', 'error');
    }
  };
</script>
</body>
</html>
