<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Admin — Esboços Bíblicos</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{--gold:#b8860b;--gold2:#d4a017;--gold-light:#fdf6e3;--text:#1a1a1a;--text2:#4a4a4a;--text3:#8a8a8a;--border:#e5e0d8;--border2:#d4cfc6;--bg:#fff;--bg2:#f9f8f6;--bg3:#f2f0ec;}
body{font-family:'DM Sans',sans-serif;background:var(--bg2);min-height:100vh;color:var(--text);}
header{display:flex;align-items:center;justify-content:space-between;padding:0 1.5rem;height:54px;background:var(--bg);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:10;}
.logo{display:flex;align-items:center;gap:10px;}
.logo-icon{width:28px;height:28px;background:var(--text);border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--gold2);font-family:'Playfair Display',serif;font-weight:600;}
.logo-text{font-family:'Playfair Display',serif;font-size:15px;color:var(--text);}
.logo-text span{color:var(--gold);}
.admin-badge{font-size:10px;padding:2px 8px;border-radius:10px;background:var(--text);color:var(--bg);font-weight:500;letter-spacing:.04em;}
.btn-sair{font-size:12px;color:var(--text3);background:none;border:1px solid var(--border);border-radius:6px;padding:5px 12px;cursor:pointer;font-family:'DM Sans',sans-serif;}
.btn-sair:hover{background:var(--bg3);}
.container{max-width:960px;margin:0 auto;padding:2rem 1.5rem;}
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:2rem;}
.stat-card{background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:1.25rem;text-align:center;}
.stat-num{font-family:'Playfair Display',serif;font-size:28px;font-weight:600;color:var(--text);margin-bottom:4px;}
.stat-label{font-size:11px;color:var(--text3);letter-spacing:.04em;text-transform:uppercase;}
.stat-card.gold{border-color:var(--gold);background:var(--gold-light);}
.stat-card.gold .stat-num{color:var(--gold);}
.stat-card.alert{border-color:#e74c3c;background:#fff5f5;}
.stat-card.alert .stat-num{color:#e74c3c;}
.section-title{font-family:'Playfair Display',serif;font-size:18px;font-weight:400;color:var(--text);margin-bottom:1rem;display:flex;align-items:center;gap:10px;}
.notif-badge{font-size:11px;padding:2px 7px;border-radius:10px;background:#e74c3c;color:#fff;font-family:'DM Sans',sans-serif;font-weight:500;}
.notif-badge.warning{background:#f39c12;}
.venc-card{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:1rem 1.25rem;margin-bottom:.6rem;display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap;}
.venc-card.grace{border-color:#f39c12;background:#fffbf0;}
.venc-card.alerta{border-color:#f39c12;background:#fffbf0;}
.venc-card.vencido{border-color:#e74c3c;background:#fff5f5;}
.venc-info{flex:1;min-width:200px;}
.venc-nome{font-size:14px;font-weight:500;color:var(--text);margin-bottom:2px;}
.venc-email{font-size:11px;color:var(--text3);}
.venc-status{font-size:11px;font-weight:500;margin-top:4px;}
.venc-status.grace{color:#f39c12;}
.venc-status.alerta{color:#f39c12;}
.venc-status.vencido{color:#e74c3c;}
.venc-data{font-size:12px;color:var(--text3);text-align:right;}
.venc-acoes{display:flex;gap:6px;}
.btn-renovar{padding:6px 12px;border-radius:6px;border:none;background:#27ae60;color:#fff;font-size:11px;cursor:pointer;font-family:'DM Sans',sans-serif;}
.btn-renovar:hover{opacity:.85;}
.btn-bloquear{padding:6px 12px;border-radius:6px;border:1px solid var(--border2);background:none;color:var(--text3);font-size:11px;cursor:pointer;font-family:'DM Sans',sans-serif;}
.btn-bloquear:hover{border-color:#e74c3c;color:#e74c3c;}
.sol-card{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:1rem 1.25rem;margin-bottom:.75rem;display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap;}
.sol-info{flex:1;}
.sol-nome{font-size:14px;font-weight:500;color:var(--text);margin-bottom:2px;}
.sol-email{font-size:12px;color:var(--text3);}
.sol-pedido{font-size:11px;color:var(--gold);margin-top:4px;}
.sol-preco{font-size:13px;font-weight:500;color:var(--text);margin-top:3px;}
.sol-acoes{display:flex;gap:6px;}
.btn-aprovar{padding:6px 14px;border-radius:6px;border:none;background:var(--text);color:var(--bg);font-size:12px;cursor:pointer;font-family:'DM Sans',sans-serif;}
.btn-aprovar:hover{opacity:.8;}
.btn-rejeitar{padding:6px 14px;border-radius:6px;border:1px solid var(--border2);background:none;color:var(--text3);font-size:12px;cursor:pointer;font-family:'DM Sans',sans-serif;}
.btn-rejeitar:hover{border-color:#e74c3c;color:#e74c3c;}
.filtros{display:flex;gap:8px;margin-bottom:1.25rem;flex-wrap:wrap;align-items:center;}
.filtro-btn{padding:6px 14px;border-radius:20px;border:1px solid var(--border);background:var(--bg);color:var(--text3);font-size:12px;cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .15s;}
.filtro-btn.active{background:var(--text);color:var(--bg);border-color:var(--text);}
.search-input{flex:1;min-width:200px;padding:7px 12px;border:1px solid var(--border2);border-radius:8px;font-size:13px;font-family:'DM Sans',sans-serif;color:var(--text);outline:none;background:var(--bg);}
.search-input:focus{border-color:var(--gold);}
.table-wrap{background:var(--bg);border:1px solid var(--border);border-radius:10px;overflow:hidden;}
.table-header{display:grid;grid-template-columns:1fr 100px 100px 140px 80px;padding:10px 16px;background:var(--bg2);border-bottom:1px solid var(--border);font-size:11px;font-weight:500;color:var(--text3);letter-spacing:.06em;text-transform:uppercase;gap:8px;}
.user-row{display:grid;grid-template-columns:1fr 100px 100px 140px 80px;padding:11px 16px;border-bottom:1px solid var(--border);align-items:center;gap:8px;transition:background .1s;}
.user-row:last-child{border-bottom:none;}
.user-row:hover{background:var(--bg2);}
.user-row.grace-row{background:#fffbf0;}
.user-row.vencido-row{background:#fff5f5;}
.user-info{display:flex;flex-direction:column;gap:2px;}
.user-nome{font-size:13px;font-weight:500;color:var(--text);}
.user-email{font-size:11px;color:var(--text3);}
.user-data{font-size:11px;color:var(--text3);}
.user-venc{font-size:11px;line-height:1.5;}
.user-venc.ok{color:#27ae60;}
.user-venc.alerta{color:#f39c12;}
.user-venc.grace{color:#f39c12;}
.user-venc.vencido{color:#e74c3c;}
.plano-select{width:100%;padding:5px 8px;border:1px solid var(--border2);border-radius:6px;font-size:12px;font-family:'DM Sans',sans-serif;color:var(--text);background:var(--bg);cursor:pointer;outline:none;}
.plano-select.gratuito{color:var(--text3);}
.plano-select.basico{color:#185FA5;}
.plano-select.premium{color:var(--gold);}
.btn-salvar{font-size:11px;padding:4px 10px;border-radius:5px;border:1px solid var(--border2);background:var(--bg2);color:var(--text2);cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .15s;white-space:nowrap;}
.btn-salvar:hover{border-color:var(--gold);color:var(--gold);background:var(--gold-light);}
.btn-salvar.saved{border-color:#2ecc71;color:#2ecc71;background:#f0fef4;}
.empty{text-align:center;padding:2rem;color:var(--text3);font-size:13px;}
.loading-row{padding:2rem;text-align:center;color:var(--text3);font-size:13px;}
.divider{height:1px;background:var(--border);margin:2rem 0;}
</style>
</head>
<body>

<header>
  <div class="logo"><div class="logo-icon">א</div><div class="logo-text">Esboços <span>Bíblicos</span></div></div>
  <div style="display:flex;align-items:center;gap:10px;">
    <span class="admin-badge">ADMIN</span>
    <button class="btn-sair" onclick="sair()">Sair</button>
  </div>
</header>

<div class="container">

  <div class="stats-grid">
    <div class="stat-card"><div class="stat-num" id="stat-total">—</div><div class="stat-label">Total de usuários</div></div>
    <div class="stat-card"><div class="stat-num" id="stat-basico">—</div><div class="stat-label">Plano básico</div></div>
    <div class="stat-card gold"><div class="stat-num" id="stat-premium">—</div><div class="stat-label">Plano premium</div></div>
    <div class="stat-card alert"><div class="stat-num" id="stat-vencendo">—</div><div class="stat-label">Vencendo / vencidos</div></div>
  </div>

  <div class="section-title">
    Vencimentos e renovações
    <span class="notif-badge warning" id="badge-venc" style="display:none">0</span>
  </div>
  <div id="lista-vencimentos"><div class="empty">Nenhum vencimento próximo. ✓</div></div>

  <div class="divider"></div>

  <div class="section-title">
    Solicitações de upgrade
    <span class="notif-badge" id="badge-sol" style="display:none">0</span>
  </div>
  <div id="lista-sol"><div class="empty">Nenhuma solicitação pendente.</div></div>

  <div class="divider"></div>

  <div class="section-title">Todos os usuários</div>
  <div class="filtros">
    <button class="filtro-btn active" onclick="filtrar('todos',this)">Todos</button>
    <button class="filtro-btn" onclick="filtrar('gratuito',this)">Gratuito</button>
    <button class="filtro-btn" onclick="filtrar('basico',this)">Básico</button>
    <button class="filtro-btn" onclick="filtrar('premium',this)">Premium</button>
    <input class="search-input" type="text" placeholder="Buscar por nome ou e-mail..." oninput="buscar(this.value)"/>
  </div>
  <div class="table-wrap">
    <div class="table-header"><div>Usuário</div><div>Cadastro</div><div>Plano</div><div>Vencimento</div><div>Ação</div></div>
    <div id="lista-usuarios"><div class="loading-row">Carregando...</div></div>
  </div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getFirestore, collection, getDocs, doc, updateDoc, query, where } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCUnfgLUuQfY6tTuUYUGkKceXTB1LDLf3M",
  authDomain: "esbocos-biblicos.firebaseapp.com",
  projectId: "esbocos-biblicos",
  storageBucket: "esbocos-biblicos.firebasestorage.app",
  messagingSenderId: "750572710955",
  appId: "1:750572710955:web:a6cce3e11d178862a38e6e"
};

const ADMIN_EMAIL = "pecky277@gmail.com";
const PRECOS = { basico: 'R$ 29,90', premium: 'R$ 49,90' };
const GRACE_DAYS = 5;
const ALERT_DAYS = 3;

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let todosUsuarios = [];
let filtroAtivo = 'todos';
let buscaAtiva = '';

onAuthStateChanged(auth, async (user) => {
  if (!user) { window.location.href = 'index.html'; return; }
  if (user.email !== ADMIN_EMAIL) { window.location.href = 'app.html'; return; }
  await carregarUsuarios();
  await carregarSolicitacoes();
});

function calcStatus(u) {
  if (!u.dataVencimento || u.plano === 'gratuito') return null;
  const hoje = new Date(); hoje.setHours(0,0,0,0);
  const venc = new Date(u.dataVencimento.seconds * 1000); venc.setHours(0,0,0,0);
  const diff = Math.floor((venc - hoje) / 86400000);
  if (diff < 0) {
    const d = Math.abs(diff);
    if (d <= GRACE_DAYS) return { tipo:'grace', dias:d, label:`Vencido há ${d} dia${d>1?'s':''} — grace period` };
    return { tipo:'vencido', dias:d, label:`Vencido há ${d} dias` };
  }
  if (diff <= ALERT_DAYS) return { tipo:'alerta', dias:diff, label:`Vence em ${diff} dia${diff!==1?'s':''}` };
  return { tipo:'ok', dias:diff, label:`Vence em ${diff} dias` };
}

async function carregarUsuarios() {
  const snap = await getDocs(collection(db, 'usuarios'));
  todosUsuarios = snap.docs.map(d => ({ id: d.id, ...d.data() }));
  atualizarStats();
  renderVencimentos();
  renderUsuarios();
}

async function carregarSolicitacoes() {
  const q = query(collection(db, 'solicitacoes'), where('status','==','pendente'));
  const snap = await getDocs(q);
  const sols = snap.docs.map(d => ({ id:d.id, ...d.data() }));
  const badge = document.getElementById('badge-sol');
  if (sols.length > 0) { badge.textContent = sols.length; badge.style.display = 'inline'; }
  const lista = document.getElementById('lista-sol');
  if (!sols.length) { lista.innerHTML = '<div class="empty">Nenhuma solicitação pendente.</div>'; return; }
  lista.innerHTML = sols.map(s => `
    <div class="sol-card" id="sol-${s.id}">
      <div class="sol-info">
        <div class="sol-nome">${s.nome||'—'}</div>
        <div class="sol-email">${s.email}</div>
        <div class="sol-pedido">Solicita upgrade para: <strong>${s.planoSolicitado}</strong></div>
        <div class="sol-preco">${PRECOS[s.planoSolicitado]||''}/mês</div>
      </div>
      <div class="sol-acoes">
        <button class="btn-aprovar" onclick="aprovarSolicitacao('${s.id}','${s.usuarioId}','${s.planoSolicitado}')">✓ Aprovar</button>
        <button class="btn-rejeitar" onclick="rejeitarSolicitacao('${s.id}')">Rejeitar</button>
      </div>
    </div>`).join('');
}

function atualizarStats() {
  const urgentes = todosUsuarios.filter(u => { const s=calcStatus(u); return s && s.tipo !== 'ok'; }).length;
  document.getElementById('stat-total').textContent = todosUsuarios.length;
  document.getElementById('stat-basico').textContent = todosUsuarios.filter(u=>u.plano==='basico').length;
  document.getElementById('stat-premium').textContent = todosUsuarios.filter(u=>u.plano==='premium').length;
  document.getElementById('stat-vencendo').textContent = urgentes;
}

function renderVencimentos() {
  const badge = document.getElementById('badge-venc');
  const urgentes = todosUsuarios
    .map(u => ({...u, status: calcStatus(u)}))
    .filter(u => u.status && u.status.tipo !== 'ok')
    .sort((a,b) => a.status.dias - b.status.dias);
  if (urgentes.length) { badge.textContent = urgentes.length; badge.style.display = 'inline'; }
  else badge.style.display = 'none';
  const lista = document.getElementById('lista-vencimentos');
  if (!urgentes.length) { lista.innerHTML = '<div class="empty">Nenhum vencimento próximo. ✓</div>'; return; }
  lista.innerHTML = urgentes.map(u => {
    const s = u.status;
    const vencStr = u.dataVencimento ? new Date(u.dataVencimento.seconds*1000).toLocaleDateString('pt-BR') : '—';
    const icon = s.tipo==='vencido'?'🔴':s.tipo==='grace'?'🟡':'⚠️';
    return `<div class="venc-card ${s.tipo}">
      <div class="venc-info">
        <div class="venc-nome">${u.nome||'—'} <small style="color:var(--text3)">(${u.plano})</small></div>
        <div class="venc-email">${u.email}</div>
        <div class="venc-status ${s.tipo}">${icon} ${s.label}</div>
      </div>
      <div class="venc-data">Venc: ${vencStr}</div>
      <div class="venc-acoes">
        <button class="btn-renovar" onclick="renovarUsuario('${u.id}')">↻ Renovar +30 dias</button>
        <button class="btn-bloquear" onclick="bloquearUsuario('${u.id}')">Bloquear</button>
      </div>
    </div>`;
  }).join('');
}

function renderUsuarios() {
  let lista = todosUsuarios;
  if (filtroAtivo !== 'todos') lista = lista.filter(u => u.plano === filtroAtivo);
  if (buscaAtiva) lista = lista.filter(u => (u.nome||'').toLowerCase().includes(buscaAtiva)||(u.email||'').toLowerCase().includes(buscaAtiva));
  const container = document.getElementById('lista-usuarios');
  if (!lista.length) { container.innerHTML = '<div class="empty">Nenhum usuário encontrado.</div>'; return; }
  container.innerHTML = lista.map(u => {
    const data = u.criadoEm ? new Date(u.criadoEm.seconds*1000).toLocaleDateString('pt-BR') : '—';
    const s = calcStatus(u);
    const vencStr = u.dataVencimento ? new Date(u.dataVencimento.seconds*1000).toLocaleDateString('pt-BR') : u.plano==='gratuito'?'—':'Sem data';
    const vencLabel = s ? `<br><span>${s.label}</span>` : '';
    const rowCls = s?.tipo==='grace'?'grace-row':s?.tipo==='vencido'?'vencido-row':'';
    const vencCls = s?.tipo||'ok';
    return `<div class="user-row ${rowCls}">
      <div class="user-info"><div class="user-nome">${u.nome||'—'}</div><div class="user-email">${u.email}</div></div>
      <div class="user-data">${data}</div>
      <div><select class="plano-select ${u.plano}" id="select-${u.id}" onchange="this.className='plano-select '+this.value">
        <option value="gratuito" ${u.plano==='gratuito'?'selected':''}>Gratuito</option>
        <option value="basico" ${u.plano==='basico'?'selected':''}>Básico</option>
        <option value="premium" ${u.plano==='premium'?'selected':''}>Premium</option>
      </select></div>
      <div class="user-venc ${vencCls}">${vencStr}${vencLabel}</div>
      <div><button class="btn-salvar" id="salvar-${u.id}" onclick="salvarPlano('${u.id}')">Salvar</button></div>
    </div>`;
  }).join('');
}

function novaData(dias) {
  const d = new Date(); d.setDate(d.getDate() + dias);
  return { seconds: Math.floor(d.getTime()/1000), nanoseconds: 0 };
}

window.salvarPlano = async (uid) => {
  const select = document.getElementById('select-'+uid);
  const btn = document.getElementById('salvar-'+uid);
  const plano = select.value;
  btn.textContent = '...'; btn.disabled = true;
  const updates = { plano };
  if (plano !== 'gratuito') { updates.dataVencimento = novaData(30); updates.notificadoVencimento = false; }
  else { updates.dataVencimento = null; }
  await updateDoc(doc(db, 'usuarios', uid), updates);
  const u = todosUsuarios.find(x=>x.id===uid);
  if (u) Object.assign(u, updates);
  atualizarStats(); renderVencimentos();
  btn.textContent = '✓ Salvo'; btn.className = 'btn-salvar saved'; btn.disabled = false;
  setTimeout(()=>{ btn.textContent='Salvar'; btn.className='btn-salvar'; renderUsuarios(); }, 2000);
};

window.renovarUsuario = async (uid) => {
  const d = novaData(30);
  await updateDoc(doc(db, 'usuarios', uid), { dataVencimento:d, notificadoVencimento:false });
  const u = todosUsuarios.find(x=>x.id===uid);
  if (u) { u.dataVencimento = d; u.notificadoVencimento = false; }
  atualizarStats(); renderVencimentos(); renderUsuarios();
};

window.bloquearUsuario = async (uid) => {
  if (!confirm('Bloquear este usuário para o plano Gratuito?')) return;
  await updateDoc(doc(db, 'usuarios', uid), { plano:'gratuito', dataVencimento:null });
  const u = todosUsuarios.find(x=>x.id===uid);
  if (u) { u.plano='gratuito'; u.dataVencimento=null; }
  atualizarStats(); renderVencimentos(); renderUsuarios();
};

window.aprovarSolicitacao = async (solId, usuarioId, plano) => {
  const d = novaData(30);
  await updateDoc(doc(db,'solicitacoes',solId), { status:'aprovado' });
  await updateDoc(doc(db,'usuarios',usuarioId), { plano, dataVencimento:d, notificadoVencimento:false });
  document.getElementById('sol-'+solId)?.remove();
  const u = todosUsuarios.find(x=>x.id===usuarioId);
  if (u) { u.plano=plano; u.dataVencimento=d; }
  atualizarStats(); renderVencimentos(); renderUsuarios();
  const badge = document.getElementById('badge-sol');
  const n = parseInt(badge.textContent)-1;
  if (n<=0) badge.style.display='none'; else badge.textContent=n;
};

window.rejeitarSolicitacao = async (solId) => {
  await updateDoc(doc(db,'solicitacoes',solId), { status:'rejeitado' });
  document.getElementById('sol-'+solId)?.remove();
  const badge = document.getElementById('badge-sol');
  const n = parseInt(badge.textContent)-1;
  if (n<=0) badge.style.display='none'; else badge.textContent=n;
};

window.filtrar = (plano, btn) => {
  filtroAtivo = plano;
  document.querySelectorAll('.filtro-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  renderUsuarios();
};
window.buscar = (v) => { buscaAtiva = v.toLowerCase(); renderUsuarios(); };
window.sair = async () => { await signOut(auth); window.location.href = 'index.html'; };
</script>
</body>
</html>
